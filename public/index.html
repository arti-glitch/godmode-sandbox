<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GodMode.js — AI Interactive Physics Sandbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body class="flex h-screen w-screen">

  <aside class="w-80 md:w-96 bg-slate-900/90 backdrop-blur-md border-r border-slate-800 flex flex-col z-10 shadow-2xl">
    <div class="p-5 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
        <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">
          GODMODE.JS
        </h1>
      </div>
      <span class="text-xs font-mono px-2 py-1 rounded bg-slate-800 text-slate-400 border border-slate-700">v2.0 Live</span>
    </div>

    <div class="flex-1 overflow-y-auto p-5 space-y-6">

      <div class="space-y-2">
        <label class="text-xs font-bold uppercase tracking-widest text-slate-400 flex items-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles text-cyan-400"></i> AI Object Spawner
        </label>
        <div class="flex gap-2">
          <input id="promptInput" type="text" placeholder="e.g. Drop a heavy bouncy neon green ball..." 
            class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 placeholder:text-slate-600">
          <button id="spawnBtn" onclick="sendAISpawnRequest()" 
            class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm flex items-center justify-center">
            <i class="fa-solid fa-bolt"></i>
          </button>
        </div>
      </div>

      <div class="space-y-4 pt-4 border-t border-slate-800/80">
        <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-indigo-400"></i> Laws of Physics
        </h2>

        <div class="space-y-1">
          <div class="flex justify-between text-xs font-mono">
            <span class="text-slate-400">Y-Gravity:</span>
            <span id="gravityVal" class="text-cyan-400 font-bold">1.0</span>
          </div>
          <input id="gravitySlider" type="range" min="-2" max="5" step="0.1" value="1" oninput="changeGravity(this.value)" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400">
        </div>

        <div class="space-y-1">
          <div class="flex justify-between text-xs font-mono">
            <span class="text-slate-400">Time Scale:</span>
            <span id="timeVal" class="text-indigo-400 font-bold">1.0x</span>
          </div>
          <input id="timeSlider" type="range" min="0" max="2" step="0.1" value="1" oninput="changeTimeScale(this.value)" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-400">
        </div>
      </div>

      <div class="space-y-2 pt-4 border-t border-slate-800/80">
        <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400">Quick Actions</h2>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="quickSpawn('box')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2 px-3 rounded flex items-center justify-center gap-2">
            <i class="fa-solid fa-cube text-cyan-400"></i> Heavy Box
          </button>
          <button onclick="quickSpawn('ball')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2 px-3 rounded flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle text-indigo-400"></i> Bouncy Ball
          </button>
        </div>
        <button onclick="triggerClearWorld()" class="w-full bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 border border-rose-800/50 text-xs py-2 rounded mt-2">
          <i class="fa-solid fa-trash-can"></i> Clear Canvas
        </button>
      </div>

      <div class="bg-slate-950/60 p-3 rounded-lg border border-slate-800 font-mono text-[11px] space-y-1">
        <div class="flex justify-between text-slate-400">
          <span>Multiplayer Node:</span>
          <span id="socketStatus" class="text-amber-400">Connecting...</span>
        </div>
        <div class="flex justify-between text-slate-400">
          <span>Active Bodies:</span>
          <span id="bodyCount" class="text-cyan-400">0</span>
        </div>
      </div>

    </div>
  </aside>

  <main id="canvasContainer" class="flex-1 relative h-full bg-slate-950 overflow-hidden">
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b15_1px,transparent_1px),linear-gradient(to_bottom,#1e293b15_1px,transparent_1px)] bg-[size:4rem_4rem] pointer-events-none"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
